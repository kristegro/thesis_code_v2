[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-decryption"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr-datasets[vision]==0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers>=4.30.0,<5.0",
    "evaluate>=0.4.0,<1.0",
    "datasets>=2.0.0, <3.0",
    "scikit-learn>=1.6.1, <2.0",
    "prometheus_client>=0.19.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Kristian Teig Grønvold"

[tool.flwr.app.components]
serverapp = "flwr_decryption.server_app:app"
clientapp = "flwr_decryption.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
num-ct = 0
ser-type = "BINARY"
num-clients = 2 # Number of clients expected to join.

[tool.flwr.federations]
default = "localhost"

[tool.flwr.federations.localhost]
options.num-supernodes = 2
address = "0.0.0.0:10093" # Address and port that flwr run should communicate with.
insecure = true
